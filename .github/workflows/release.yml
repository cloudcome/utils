name: release

on:
  workflow_dispatch:
    inputs:
      first-version:
        description: '是否首个版本'
        required: true
        type: boolean

jobs:
  bump-version:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm
      - run: |
          npm run build
          npm run lint
          npm run test
          ${github.event.inputs.first-version} || npx lerna version --yes --create-release=github
          npx lerna publish from-package --yes
      - uses: FrontEndDev-org/npm-mirror-sync-action@v1
