name: release

on:
  workflow_dispatch:
    inputs:
      first-version:
        description: "是否发布首个版本"
        required: true
        type: choice
        options:
          - "false"
          - "true"

jobs:
  release:
    if: github.ref_name == 'v1.x'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm

      - name: build
        run: npm run build

      - name: lint
        run: npm run lint

      - name: test
        run: npm run test

      - name: git user
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: bump version
        run: npm run ci:version -- --first-version=${{github.event.inputs.first-version}}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: publish
        run: npx lerna publish from-package --yes
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - uses: FrontEndDev-org/npm-mirror-sync-action@v1
