name: release

on:
  workflow_dispatch:
    inputs:
      first-version:
        description: "是否发布首个版本"
        required: true
        type: choice
        options:
          - "NOT"
          - "YES"

jobs:
  release:
    if: github.ref_name == 'v1.x'
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-pnpm

      - name: Build
        run: npm run build

      - name: Code lint
        run: npm run lint

      - name: Unit test
        run: npm run test

      - name: Setup git user
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        run: npm run ci:version -- --first-version=${{github.event.inputs.first-version}}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to NPM
        uses: FrontEndDev-org/publish-node-package-action@v4
        with:
          target: 'npm'
          token: ${{ secrets.NPM_TOKEN }}

      - name: Publish to GitHub
        uses: FrontEndDev-org/publish-node-package-action@v4
        with:
          target: 'github'
          token: ${{ secrets.GITHUB_TOKEN }}
