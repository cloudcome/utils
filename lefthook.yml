# @file lefthook.yml
# @ref https://evilmartians.github.io/lefthook/

pre-commit:
  commands:
    stage-biome:
      glob: "*"
      run: npx biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    project-lint:
      glob: "*"
      run: npm run lint

commit-msg:
  commands:
    commit-lint:
      run: npx commitlint --edit
